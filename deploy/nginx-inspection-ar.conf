# 用服务器 IP 访问时提供管理端页面，并把 /api/ 转发给 Go 后端。
# server_name 精确匹配 IP，不影响 default_server 和其他按域名访问的站点。
server {
    listen 80;
    listen [::]:80;
    server_name 117.72.117.250;

    root /opt/inspection-ar/web;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 1m;
    }

    # 单页应用：静态资源带 hash，可长期缓存；其余路径回落到 index.html
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
